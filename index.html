<script>
/* Draw the home-screen icon with this phone's own bee emoji (the Apple bee on an iPhone). Falls back to apple-touch-icon.png. */
(function () {
  try {
    var S = 180, c = document.createElement("canvas"); c.width = c.height = S;
    var g = c.getContext("2d"), r = g.createRadialGradient(S * .3, S * .25, 10, S * .5, S * .5, S * .75);
    r.addColorStop(0, "#5BA67E"); r.addColorStop(.6, "#3F8A63"); r.addColorStop(1, "#336F50");
    g.fillStyle = r; g.fillRect(0, 0, S, S);
    g.textAlign = "center"; g.textBaseline = "middle";
    g.font = "112px 'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif";
    g.fillText("\uD83D\uDC1D", S / 2, S / 2 + 6);
    var url = c.toDataURL("image/png");
    if (url.length > 2000) document.querySelector('link[rel="apple-touch-icon"]').href = url;
  } catch (e) {}
})();
</script>

<title>Maya's agenda</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800;900&display=swap">
<style>
/* Layout: colourful gradient header with tabs (laptop) or bottom tab bar + floating add button (phone); main view left, sidebar right, stacks on phones */
:root {
  --bg: #E4ECE5; --surface: #FFFFFF; --surface-2: #E6EEE7; --ink: #1F2A23; --muted: #627068; --line: #D2DED5;
  --accent: #3F8A63; --accent-ink: #FFFFFF; --accent-2: #3F8A63; --mark: #F4DA8A; --mark-ink: #2A2129; --danger: #C8413F; --ok: #3E9A78;
  --c-school: #6A82D0; --c-werk: #CF8C52; --c-leuk: #CC6B97; --c-sport: #4E9E80; --c-prive: #9479C9; --c-overig: #5B9AAB;
  --d0: #EBF2EC; --d1: #EBF2EC; --d2: #EBF2EC; --d3: #EBF2EC; --d4: #EBF2EC; --d5: #EBF2EC; --d6: #EBF2EC;
  --hdr: #FFFFFF;
  --blob1: transparent; --blob2: transparent; --blob3: transparent;
  --shadow: 0 1px 2px rgb(30 60 40 / .05);
  --f-display: "Fredoka", "Trebuchet MS", system-ui, sans-serif;
  --f-body: "Nunito", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono: "Nunito", ui-monospace, Menlo, monospace;
  --r: 18px; --hour: 54px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121815; --surface: #1A221D; --surface-2: #233028; --ink: #E8F1EB; --muted: #9BAAA0; --line: #2C3A31;
  --accent: #7CCBA2; --accent-ink: #121815; --accent-2: #7CCBA2; --mark: #E3C66E; --mark-ink: #2A2129; --danger: #F07A72; --ok: #6CC5A0;
  --c-school: #93A6E6; --c-werk: #E2A878; --c-leuk: #E392B6; --c-sport: #7CC2A5; --c-prive: #B7A0E4; --c-overig: #86BFCE;
  --d0: #233028; --d1: #233028; --d2: #233028; --d3: #233028; --d4: #233028; --d5: #233028; --d6: #233028;
  --hdr: #1A221D;
  --blob1: transparent; --blob2: transparent; --blob3: transparent;
  --shadow: none;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #121815; --surface: #1A221D; --surface-2: #233028; --ink: #E8F1EB; --muted: #9BAAA0; --line: #2C3A31;
  --accent: #7CCBA2; --accent-ink: #121815; --accent-2: #7CCBA2; --mark: #E3C66E; --mark-ink: #2A2129; --danger: #F07A72; --ok: #6CC5A0;
  --c-school: #93A6E6; --c-werk: #E2A878; --c-leuk: #E392B6; --c-sport: #7CC2A5; --c-prive: #B7A0E4; --c-overig: #86BFCE;
  --d0: #233028; --d1: #233028; --d2: #233028; --d3: #233028; --d4: #233028; --d5: #233028; --d6: #233028;
  --hdr: #1A221D;
  --blob1: transparent; --blob2: transparent; --blob3: transparent;
  --shadow: none;
  color-scheme: dark; }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.45;
  background-image: radial-gradient(circle at 8% 12%, var(--blob1) 0, transparent 32%), radial-gradient(circle at 92% 30%, var(--blob2) 0, transparent 30%), radial-gradient(circle at 40% 95%, var(--blob3) 0, transparent 34%);
  background-attachment: fixed; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--hdr); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent-2); outline-offset: 2px; }
.mono { font-variant-numeric: tabular-nums; font-weight: 700; }

.cat-school { --c: var(--c-school); } .cat-werk { --c: var(--c-werk); } .cat-leuk { --c: var(--c-leuk); }
.cat-sport { --c: var(--c-sport); } .cat-prive { --c: var(--c-prive); } .cat-overig { --c: var(--c-overig); }
.wd0 { --dc: var(--d0); } .wd1 { --dc: var(--d1); } .wd2 { --dc: var(--d2); } .wd3 { --dc: var(--d3); } .wd4 { --dc: var(--d4); } .wd5 { --dc: var(--d5); } .wd6 { --dc: var(--d6); }

/* Header */
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--hdr); box-shadow: 0 4px 18px rgb(63 138 99 / .12); }
.top-inner { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; max-width: 1400px; margin: 0 auto; }
.brand { font-family: var(--f-display); font-weight: 600; font-size: 23px; letter-spacing: .005em; display: flex; align-items: center; gap: 8px; color: var(--ink); }
.brand .bee { font-size: 28px; line-height: 1; flex: none; }
.login-logo .bee { font-size: 44px; line-height: 1; }
.tabs { display: flex; flex-wrap: wrap; gap: 4px; background: rgb(255 255 255 / .45); padding: 4px; border-radius: 999px; }
.tabs button { border: 0; background: transparent; padding: 7px 13px; border-radius: 999px; font-weight: 800; font-size: 14px; color: var(--ink); opacity: .78; }
.tabs button:hover { opacity: 1; }
.tabs button[aria-current="true"] { background: var(--surface); color: var(--accent); opacity: 1; box-shadow: 0 2px 8px rgb(0 0 0 / .12); }
.filters .tabs { background: var(--surface-2); }
.spacer { flex: 1; }
.btn { border: 2px solid var(--line); background: var(--surface); padding: 7px 14px; border-radius: 999px; font-weight: 800; font-size: 14px; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { border-color: var(--accent); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); box-shadow: 0 4px 12px rgb(63 138 99 / .25); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.small { padding: 5px 11px; font-size: 13px; }
.btn.danger { color: var(--danger); }
header .btn.primary { background: var(--ink); border-color: var(--ink); color: var(--surface); box-shadow: none; }

/* Page */
.page { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 48px; max-width: 1400px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr) 330px; gap: 22px; align-items: start; }
@media (max-width: 1000px) { .page { grid-template-columns: minmax(0, 1fr); } }
.navbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; margin-bottom: 16px; }
.navbar h1 { font-family: var(--f-display); font-weight: 600; font-size: 30px; line-height: 1.1; margin: 0; text-wrap: balance; }
.navbar h1::after { content: ""; display: block; height: 7px; width: 64px; margin-top: 4px; border-radius: 4px; background: linear-gradient(90deg, var(--accent), var(--mark)); }
.navbar .sub { color: var(--muted); font-size: 14px; margin-top: 4px; }
.navbtns { display: flex; gap: 6px; }
.notice { font-size: 13px; color: var(--muted); padding: 8px 14px; border: 2px dashed var(--line); border-radius: 14px; margin-bottom: 14px; background: var(--surface); }
.notice strong { color: var(--ink); }

.panel { background: var(--surface); border: 0; border-radius: var(--r); box-shadow: var(--shadow); }
.panel-h { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; padding: 14px 16px 6px; }
.panel-h h2, .panel-h h3 { font-family: var(--f-display); font-size: 18px; font-weight: 600; margin: 0; }
.panel-b { padding: 4px 16px 16px; }
.eyebrow { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 800; }
.muted { color: var(--muted); }
.empty { color: var(--muted); font-size: 14px; padding: 6px 0; }

/* Chips */
.chip { display: flex; align-items: baseline; gap: 6px; width: 100%; text-align: left; border: 0; background: color-mix(in srgb, var(--c) 18%, var(--surface)); color: var(--ink); padding: 4px 8px; border-radius: 10px; font-size: 13px; line-height: 1.3; min-width: 0; font-weight: 700; position: relative; }
.chip::after { content: ""; position: absolute; left: 0; top: 4px; bottom: 4px; width: 4px; border-radius: 0 3px 3px 0; background: var(--c); }
.chip .t { font-size: 11.5px; color: color-mix(in srgb, var(--c) 70%, var(--ink)); flex: none; font-weight: 800; font-variant-numeric: tabular-nums; }
.chip .n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.chip.deadline { background: var(--c); color: var(--surface); }
.chip.deadline::after { display: none; }
.chip.deadline .t { color: var(--surface); opacity: .9; }
.chip.deadline::before { content: "⚑"; flex: none; }
.chip.done .n { text-decoration: line-through; opacity: .7; }
.chip.task { background: var(--surface-2); font-weight: 600; }

/* Task rows */
.task { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: start; gap: 10px; padding: 9px 0; border-bottom: 2px dotted var(--line); }
.task:last-child { border-bottom: 0; }
.task input[type=checkbox] { appearance: none; -webkit-appearance: none; width: 24px; height: 24px; margin: 0; border: 2.5px solid var(--c, var(--accent)); border-radius: 8px; cursor: pointer; display: grid; place-content: center; background: var(--surface); flex: none; }
.task input[type=checkbox]::after { content: "✓"; color: var(--surface); font-weight: 900; font-size: 15px; transform: scale(0); }
.task input[type=checkbox]:checked { background: var(--c, var(--accent)); }
.task input[type=checkbox]:checked::after { transform: scale(1); }
@media (prefers-reduced-motion: no-preference) { .task input[type=checkbox]::after { transition: transform .18s cubic-bezier(.3,1.6,.5,1); } }
.task .title { border: 0; background: none; padding: 0; text-align: left; font-weight: 700; overflow-wrap: anywhere; }
.task.is-done .title { text-decoration: line-through; text-decoration-color: var(--accent); text-decoration-thickness: 2px; color: var(--muted); }
.meta { display: flex; flex-wrap: wrap; gap: 4px 8px; font-size: 12.5px; color: var(--muted); margin-top: 2px; }
.tag { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 800; color: color-mix(in srgb, var(--c, var(--muted)) 80%, var(--ink)); background: color-mix(in srgb, var(--c, var(--muted)) 14%, transparent); padding: 1px 8px; border-radius: 999px; }
.ex { font-size: 10px; text-transform: uppercase; letter-spacing: .06em; background: var(--mark); color: var(--mark-ink); border-radius: 999px; padding: 1px 6px; font-weight: 800; margin-left: 4px; }
.task-actions { display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }

/* Quick add */
.quick { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 12px; }
.quick input { flex: 1 1 140px; min-width: 0; border: 2px solid var(--line); background: var(--bg); border-radius: 999px; padding: 8px 14px; }
.quick input:focus { border-color: var(--accent); outline: none; }
.quick input.sm { flex: 0 1 130px; }

/* Month */
.month { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.month .dow { padding: 6px 8px; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; font-weight: 800; text-align: center; border-radius: 999px; background: var(--dc); color: var(--ink); }
.mcell { min-height: 112px; border-radius: 14px; padding: 5px; display: flex; flex-direction: column; gap: 3px; cursor: pointer; min-width: 0; background: var(--surface); box-shadow: 0 2px 8px rgb(30 60 40 / .05); }
.mcell:hover { box-shadow: inset 0 0 0 2px var(--accent); }
.mcell.out { background: transparent; box-shadow: none; }
.mcell.out .dnum { color: var(--muted); }
.dnum { font-size: 13px; font-weight: 800; align-self: flex-start; padding: 1px 8px; border-radius: 999px; border: 0; background: none; font-variant-numeric: tabular-nums; }
.is-today .dnum, .dnum.today { background: var(--accent); color: var(--accent-ink); }
.mcell.is-today { box-shadow: inset 0 0 0 2.5px var(--accent); }
.more { font-size: 12px; color: var(--muted); padding-left: 4px; font-weight: 700; }
.dots { display: none; gap: 3px; flex-wrap: wrap; padding: 0 4px; }
.dots i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
.dots i.dd { border-radius: 2px; transform: rotate(45deg); }
@media (max-width: 640px) {
  .month { gap: 3px; }
  .month .dow { padding: 4px 0; font-size: 10.5px; letter-spacing: .02em; }
  .mcell { min-height: 82px; border-radius: 8px; padding: 2px; gap: 2px; }
  .mcell .chip { font-size: 9.5px; padding: 1px 3px 1px 5px; border-radius: 4px; line-height: 1.25; gap: 2px; }
  .mcell .chip .t { display: none; }
  .mcell .chip.deadline::before { display: none; }
  .mcell .chip .n { white-space: normal; overflow-wrap: break-word; hyphens: auto; -webkit-hyphens: auto; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; line-height: 1.2; }
  .mcell .chip { padding: 2px 2px 2px 5px; }
  .mcell .more { font-size: 9.5px; padding-left: 2px; }
  .dnum { padding: 0 6px; font-size: 12px; }
}

@media (max-width: 760px) { body[data-view="dag"] aside.side, body[data-view="maand"] aside.side { display: none; } }
@media (prefers-reduced-motion: no-preference) {
  #main.sw-next { animation: swn .22s ease; } #main.sw-prev { animation: swp .22s ease; }
  @keyframes swn { from { transform: translateX(28px); opacity: .3; } }
  @keyframes swp { from { transform: translateX(-28px); opacity: .3; } }
}
.range { font-weight: 700; color: var(--accent); }

/* Week */
.week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 10px; }
.wday { background: var(--surface); border-radius: var(--r); padding: 0 0 8px; display: flex; flex-direction: column; gap: 5px; min-height: 270px; min-width: 0; box-shadow: var(--shadow); overflow: hidden; }
.wday > :not(.wday-h) { margin-inline: 8px; width: auto; }
.wday.is-today { box-shadow: 0 0 0 3px var(--accent), var(--shadow); }
.wday-h { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px; border: 0; background: var(--dc); color: var(--ink); padding: 8px 10px; text-align: left; width: 100%; margin-bottom: 4px; }
.wday-h .d { font-family: var(--f-display); font-weight: 600; font-size: 16px; text-transform: capitalize; }
.wday-h .dnum { white-space: nowrap; font-size: 13px; background: rgb(255 255 255 / .55); color: var(--ink); }
.wday-h .dnum.today { background: var(--surface); color: var(--accent); }
.wday .add { margin-top: auto; border: 2px dashed var(--line); background: none; border-radius: 12px; color: var(--muted); font-size: 13px; padding: 6px; font-weight: 700; }
.wday .add:hover { color: var(--accent); border-color: var(--accent); }
.taskcount { font-size: 12.5px; color: var(--muted); border: 0; background: var(--surface-2); border-radius: 10px; padding: 5px 8px; text-align: left; font-weight: 700; }
.taskcount b { color: var(--accent); }
@media (max-width: 900px) { .week { grid-template-columns: minmax(0, 1fr); } .wday { min-height: 0; } }

/* Day */
.daystrip { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; margin-bottom: 16px; }
.daystrip button { border: 0; background: var(--surface); border-radius: 14px; padding: 7px 2px; display: flex; flex-direction: column; align-items: center; gap: 1px; font-size: 12px; color: var(--muted); font-weight: 800; box-shadow: 0 2px 8px rgb(30 60 40 / .05); border-top: 5px solid var(--dc); }
.daystrip button b { font-size: 17px; color: var(--ink); font-variant-numeric: tabular-nums; }
.daystrip button[aria-current="true"] { background: var(--dc); color: var(--ink); transform: translateY(-2px); }
.daystrip button.today b { color: var(--accent); }
.daystrip .bar { width: 70%; height: 4px; background: var(--surface-2); border-radius: 2px; overflow: hidden; margin-top: 3px; }
.daystrip .bar i { display: block; height: 100%; background: var(--accent); }
.daygrid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; align-items: start; }
.allday { display: flex; flex-direction: column; gap: 4px; padding: 0 16px 10px; }
.timeline { position: relative; margin: 0 14px 14px 54px; border-left: 2px solid var(--line); }
.hour { height: var(--hour); border-top: 1px dashed var(--line); position: relative; }
.hour span { position: absolute; left: -50px; top: -9px; font-size: 11.5px; font-weight: 700; color: var(--muted); width: 42px; text-align: right; font-variant-numeric: tabular-nums; }
.block { position: absolute; border: 0; background: color-mix(in srgb, var(--c) 22%, var(--surface)); border-radius: 10px; padding: 4px 8px 4px 10px; text-align: left; overflow: hidden; font-size: 13px; line-height: 1.25; color: var(--ink); font-weight: 700; }
.block::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: var(--c); }
.block .t { font-size: 11px; color: color-mix(in srgb, var(--c) 70%, var(--ink)); display: block; font-weight: 800; }
.block.task { background: var(--surface); box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--c) 45%, transparent); }
.block.done { opacity: .55; } .block.done .n { text-decoration: line-through; }
.block.deadline { background: var(--c); color: var(--surface); }
.block.deadline .t { color: var(--surface); }
.nowline { position: absolute; left: -5px; right: 0; height: 2px; background: var(--accent); z-index: 2; pointer-events: none; }
.nowline::before { content: ""; position: absolute; left: -4px; top: -4px; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); }
.group { margin-top: 12px; }
.group:first-child { margin-top: 0; }
.group-h { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 0 4px; border-bottom: 3px solid color-mix(in srgb, var(--c, var(--line)) 45%, transparent); }
.group-h .tag { font-size: 13.5px; }

/* Progress */
.progress { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--muted); font-weight: 700; }
.progress .track { flex: 1; height: 10px; background: var(--surface-2); border-radius: 999px; overflow: hidden; min-width: 60px; }
.progress .track i { display: block; height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--accent), var(--mark)); }
@media (prefers-reduced-motion: no-preference) { .progress .track i { transition: width .4s ease; } }

/* Deadlines */
.dl-list { display: grid; gap: 12px; }
.dl { display: grid; grid-template-columns: 66px minmax(0, 1fr) auto; gap: 14px; align-items: start; padding: 14px 16px; background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); }
.dl .when { text-align: center; line-height: 1.1; background: var(--c); color: var(--surface); border-radius: 14px; padding: 6px 0; }
.dl .when b { display: block; font-family: var(--f-display); font-size: 26px; font-weight: 600; }
.dl .when span { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; font-weight: 800; }
.dl h3 { margin: 0; font-size: 17px; font-weight: 800; }
.dl.is-done { opacity: .75; }
.dl.is-done h3 { text-decoration: line-through; color: var(--muted); }
.left { font-size: 12.5px; font-weight: 800; padding: 2px 9px; border-radius: 999px; background: var(--surface-2); color: var(--ink); white-space: nowrap; }
.left.soon { background: var(--mark); color: var(--mark-ink); }
.left.late { background: var(--danger); color: #fff; }
.subtasks { margin-top: 8px; }
.subtasks .task { padding: 6px 0; font-size: 14px; }
@media (max-width: 560px) { .dl { grid-template-columns: 52px minmax(0, 1fr); } .dl > .task-actions { grid-column: 1 / -1; justify-content: flex-start; } }

/* Done log */

.month .dow { background: none; color: var(--muted); padding: 8px 0 6px; font-size: 12px; letter-spacing: .06em; }
.wk { font-size: 11px; font-weight: 700; color: var(--muted); text-align: center; padding-top: 8px; border-top: 1px solid var(--line); }
.mcell, .mcell.out { background: transparent; border: 0; border-top: 1px solid var(--line); border-radius: 0; box-shadow: none; min-height: 104px; padding: 6px 3px; gap: 4px; align-items: stretch; }
.mcell:hover { background: color-mix(in srgb, var(--accent) 6%, transparent); border-color: var(--line); }
.mcell .dnum { align-self: center; padding: 1px 7px; font-size: 14px; font-weight: 700; }
.mcell.out .dnum { color: var(--muted); opacity: .55; }
.mcell.out .mpill { opacity: .55; }
.mcell.wkend:not(.out) .dnum { color: var(--danger); }
.mcell.is-today { background: color-mix(in srgb, var(--accent) 9%, transparent); border: 0; border-top: 1px solid var(--line); box-shadow: none; }
.mcell.is-today .dnum { background: var(--accent); color: var(--accent-ink); }
.mpill { display: block; text-align: center; font-weight: 700; font-size: 13px; line-height: 1.25; padding: 4px 4px; border-radius: 7px; background: color-mix(in srgb, var(--c) 15%, var(--surface)); color: color-mix(in srgb, var(--c) 82%, var(--ink)); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-transform: lowercase; }
.mpill.dl { background: var(--surface); box-shadow: inset 0 0 0 1.5px var(--c); }
.mcell .more { text-align: center; font-size: 11.5px; }
@media (max-width: 640px) {
  .month { grid-template-columns: 18px repeat(7, minmax(0, 1fr)); padding: 2px 2px 6px 0; }
  .month .dow { font-size: 10.5px; letter-spacing: .02em; }
  .wk { font-size: 9.5px; }
  .mcell, .mcell.out { min-height: 78px; padding: 4px 1.5px; gap: 3px; }
  .mcell .dnum { font-size: 13px; padding: 0 5px; }
  .mpill { font-size: 10.5px; padding: 3px 1px; border-radius: 5px; }
}
@media (max-width: 760px) { .top-inner { flex-wrap: nowrap; gap: 4px; } .brand { min-width: 0; } .iconbtn { padding: 7px 8px; } }
/* Month: each day its own box */
.month { background: none; border: 0; border-radius: 0; overflow: visible; padding: 0; gap: 5px; }
.month .dow { padding: 2px 0 0; }
.wk { border-top: 0; padding-top: 10px; }
.mcell, .mcell.out { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
.mcell.out { background: color-mix(in srgb, var(--surface) 55%, transparent); }
.mcell:hover { border-color: var(--accent); background: var(--surface); }
.mcell.is-today { background: color-mix(in srgb, var(--accent) 9%, var(--surface)); border: 1.5px solid var(--accent); }
@media (max-width: 640px) { .month { gap: 3px; } .mcell, .mcell.out { border-radius: 7px; } }

/* Month: show what is planned (titles), wrap to two lines */
.mcell .mpill { text-transform: none; white-space: normal; overflow-wrap: break-word; hyphens: auto; -webkit-hyphens: auto; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; text-overflow: clip; text-align: left; padding: 3px 6px; font-weight: 600; }
@media (max-width: 640px) { .mcell .mpill { padding: 2px 2px 2px 3px; font-size: 9.5px; line-height: 1.2; text-align: left; letter-spacing: -.01em; } }

/* Day timeline: text always at the top of the block */
.timeline .block { display: flex; flex-direction: column; justify-content: flex-start; align-items: stretch; text-align: left; }
.timeline .block .t, .timeline .block .n { display: block; }

.brand[data-act="home"] { cursor: pointer; -webkit-user-select: none; user-select: none; }
.brand[data-act="home"]:active { opacity: .7; }
</style>

</head>
<body>
<div class="login" id="login" hidden>
  <form class="login-card" id="login-form" autocomplete="on">
    <div class="login-logo"><span class="bee" aria-hidden="true">🐝</span></div>
    <h1>Welkom terug</h1>
    <p class="muted">Log in om je agenda te openen.</p>
    <div class="field"><label for="l-user">Gebruikersnaam</label><input id="l-user" name="username" autocomplete="username" autocapitalize="off" required></div>
    <div class="field"><label for="l-pass">Wachtwoord</label><div class="pw"><input id="l-pass" name="password" type="password" autocomplete="current-password" required><button type="button" class="btn small ghost" data-act="pw-toggle">Toon</button></div></div>

</div>

    <nav class="tabs" id="tabs" aria-label="Weergave">
      <button data-act="view" data-view="dag">Dag</button>
      <button data-act="view" data-view="week">Week</button>
      <button data-act="view" data-view="maand">Maand</button>
      <button data-act="view" data-view="lijst">To-do lijst</button>

    <button class="btn ghost iconbtn" data-act="logout" aria-label="Uitloggen" title="Uitloggen"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4h4a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-4M10 16l4-4-4-4M14 12H4"/></svg><span class="lbl">Uitloggen</span></button>

<div class="page">
  <main id="main" aria-live="polite"></main>
  <aside class="side" id="side"></aside>
</div>
<nav class="bnav" id="bnav" aria-label="Weergave">
  <button data-act="view" data-view="dag"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4 7 17M17 7l1.4-1.4"/></svg>Dag</button>
  <button data-act="view" data-view="week"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>Week</button>
  <button data-act="view" data-view="maand"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 14h1M12 14h1M16 14h1M8 17h1M12 17h1"/></svg>Maand</button>
  <button data-act="view" data-view="lijst"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h12M8 12h12M8 18h12"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/></svg>Lijst</button>
  <button data-act="view" data-view="todos"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="4"/><path d="m8 12 3 3 5-6"/></svg>To-do's</button>
  <button data-act="view" data-view="deadlines"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 21V4M6 4h11l-2 4 2 4H6"/></svg>Deadline</button>
  <button data-act="view" data-view="gedaan"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="m8.5 12 2.5 2.5 4.5-5"/></svg>Gedaan</button>
</nav>
<button class="fab" data-act="new" id="fab" aria-label="Nieuw item toevoegen">+</button>
<div class="overlay" id="overlay" hidden></div>
<div class="toast" id="toast" hidden></div>

<script>
(() => {
"use strict";
document.documentElement.lang = "nl";
/* ---------- constants & helpers ---------- */
const DEFAULT_CATS = [
  { id: "school", label: "School", color: "#6A82D0" }, { id: "werk", label: "Werk", color: "#CF8C52" }, { id: "leuk", label: "Leuk", color: "#CC6B97" },
  { id: "sport", label: "Sport", color: "#4E9E80" }, { id: "prive", label: "Privé", color: "#9479C9" }, { id: "overig", label: "Overig", color: "#5B9AAB" },
];
const SWATCHES = ["#6A82D0", "#4F7FA0", "#5B9AAB", "#4E9E80", "#7C9A4E", "#C9A73E", "#CF8C52", "#D0685E", "#CC6B97", "#9479C9", "#A07862", "#8A8F98"];
const LS_CATS = "agenda-cats-v1";
const okColor = c => /^#[0-9a-fA-F]{6}$/.test(c || "");
let CATS = DEFAULT_CATS.slice(), CAT = {};
function setCats(list) {
  const clean = Array.isArray(list) ? list.filter(c => c && /^[a-z0-9_-]{1,40}$/i.test(c.id) && okColor(c.color)).map(c => ({ id: c.id, label: String(c.label || "").slice(0, 40) || "Naamloos", color: c.color })) : [];
  CATS = clean.length ? clean : DEFAULT_CATS.map(c => ({ ...c }));
  CAT = Object.fromEntries(CATS.map(c => [c.id, c]));
  let el = document.getElementById("catstyle");
  if (!el) { el = document.createElement("style"); el.id = "catstyle"; document.body.appendChild(el); }
  const rule = (pre, c, v) => `${pre}.cat-${c.id}{--c:${v}}`;
  const mix = c => `color-mix(in srgb, ${c.color} 72%, white)`;
  el.textContent = CATS.map(c => rule("", c, c.color)).join("") +
    `@media (prefers-color-scheme: dark){${CATS.map(c => rule(':root:not([data-theme="light"]) ', c, mix(c))).join("")}}` +
    CATS.map(c => rule(':root[data-theme="dark"] ', c, mix(c))).join("");
}
const defaultCat = pref => CAT[pref] ? pref : (CATS[0] ? CATS[0].id : "overig");
setCats(null);
const KIND_LABEL = { event: "Activiteit", deadline: "Deadline", task: "Taak" };
const DOW = ["ma", "di", "wo", "do", "vr", "za", "zo"];
const DOW_LONG = ["maandag", "dinsdag", "woensdag", "donderdag", "vrijdag", "zaterdag", "zondag"];
const MONTHS = ["januari", "februari", "maart", "april", "mei", "juni", "juli", "augustus", "september", "oktober", "november", "december"];
const MON_S = ["jan", "feb", "mrt", "apr", "mei", "jun", "jul", "aug", "sep", "okt", "nov", "dec"];
const DAY_START = 6, DAY_END = 24;
const LS_KEY = "agenda-todos-v1";

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pad = n => String(n).padStart(2, "0");
const key = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parse = k => { const [y, m, d] = k.split("-").map(Number); return new Date(y, m - 1, d); };
const addDays = (k, n) => { const d = parse(k); d.setDate(d.getDate() + n); return key(d); };
const dowIdx = k => (parse(k).getDay() + 6) % 7;
const weekStart = k => addDays(k, -dowIdx(k));
const todayKey = () => key(new Date());
const t2m = t => { if (!t) return null; const [h, m] = t.split(":").map(Number); return h * 60 + m; };
const daysBetween = (a, b) => Math.round((parse(b) - parse(a)) / 86400000);
const uid = () => "i" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
function isoWeek(k) {
  const d = parse(k); d.setDate(d.getDate() + 3 - ((d.getDay() + 6) % 7));
  const w1 = new Date(d.getFullYear(), 0, 4);
  return 1 + Math.round(((d - w1) / 86400000 - 3 + ((w1.getDay() + 6) % 7)) / 7);
}
const fmtShort = k => { const d = parse(k); return `${DOW[dowIdx(k)]} ${d.getDate()} ${MON_S[d.getMonth()]}`; };
const fmtLong = k => { const d = parse(k); return `${DOW_LONG[dowIdx(k)]} ${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()}`; };
const timeRange = it => it.start ? (it.end ? `${it.start}–${it.end}` : it.start) : "";

/* ---------- state ---------- */
const VIEWS = ["dag", "week", "maand", "lijst", "todos", "deadlines", "gedaan"];
const state = {
  view: VIEWS.includes(location.hash.slice(1)) ? location.hash.slice(1) : "week",
  cursor: todayKey(),
  items: {},
  mode: "loading", // loading | db | local
  readOnly: false,
  weekTasks: false,
  showDoneDeadlines: false,
  listFilter: "open", // open | planned | all
  planning: null,
};
try { state.weekTasks = localStorage.getItem("agenda-weektasks") === "1"; } catch (e) {}

const all = () => Object.values(state.items);
const tasks = () => all().filter(i => i.kind === "task");
const deadlines = () => all().filter(i => i.kind === "deadline");
const byTime = (a, b) => (a.start || "").localeCompare(b.start || "") || (a.title || "").localeCompare(b.title || "");
const spans = (i, k) => !!i.date && (i.date === k || (!!i.endDate && i.kind !== "deadline" && i.date < k && k <= i.endDate));
const onDay = (k, kinds) => all().filter(i => kinds.includes(i.kind) && spans(i, k)).sort(byTime);
const rangeLabel = i => i.endDate && i.endDate > i.date ? `${fmtShort(i.date)} – ${fmtShort(i.endDate)}` : "";
const subjects = () => [...new Set(tasks().map(t => t.subject).filter(Boolean))].sort();

/* ---------- storage ---------- */
let col = null; const chains = {};
function persistLocal() { try { localStorage.setItem(LS_KEY, JSON.stringify(state.items)); } catch (e) {} }
function writeErr(e) {
  if (e && e.code === "invalid_argument") { state.readOnly = true; toast("Opslaan lukt niet: je kunt deze planner alleen bekijken."); render(); }
  else if (e && e.code === "quota_exceeded") toast("De opslag is vol. Verwijder oude items om nieuwe toe te voegen.");
  else toast("Opslaan mislukt. Probeer het zo nog eens.");
}
function save(item) {
  state.items[item.id] = item;
  if (state.mode === "db" && col) {
    const body = JSON.parse(JSON.stringify(item));
    chains[item.id] = (chains[item.id] || Promise.resolve()).then(() => col.doc(item.id).set(body)).catch(writeErr);
  } else persistLocal();
}
function remove(id) {
  delete state.items[id];
  if (state.mode === "db" && col) {
    chains[id] = (chains[id] || Promise.resolve()).then(() => col.doc(id).delete()).catch(writeErr);
  } else persistLocal();
}
function saveCats() {
  const body = { kind: "settings", cats: CATS.map(c => ({ ...c })) };
  if (state.mode === "db" && col) chains._settings = (chains._settings || Promise.resolve()).then(() => col.doc("_settings").set(body)).catch(writeErr);
  else { try { localStorage.setItem(LS_CATS, JSON.stringify(body.cats)); } catch (e) {} }
}
function useLocal() {
  try { setCats(JSON.parse(localStorage.getItem(LS_CATS) || "null")); } catch (e) {}
  state.mode = "local";
  try { state.items = JSON.parse(localStorage.getItem(LS_KEY) || "{}") || {}; } catch (e) { state.items = {}; }
  render();
}
async function initStore() {
  if (!window.claude || typeof window.claude.use !== "function") return useLocal();
  let db = null, user = null, id = null;
  try { [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]); } catch (e) {}
  try { id = user ? await user.id() : null; } catch (e) {}
  if (!db || !id) return useLocal();
  try { col = db.collection("data/users/" + id); } catch (e) { return useLocal(); }
  let first = true;
  const timer = setTimeout(() => { if (first) { state.slow = true; render(); } }, 10000);
  col.onSnapshot(snap => {
    const next = {};
    let cats = null;
    snap.docs.forEach(d => { const v = d.data(); if (!v) return; if (d.id === "_settings") cats = v.cats; else next[d.id] = { ...v, id: d.id }; });
    setCats(cats);
    state.items = next; state.mode = "db";
    if (!snap.metadata.fromCache) { first = false; state.slow = false; clearTimeout(timer); }
    render();
  }, err => {
    clearTimeout(timer); first = false; state.slow = false;
    if (state.mode !== "db") useLocal(); else { toast("De verbinding met je opslag is verbroken. Herlaad de pagina."); }
  });
}

/* ---------- confetti ---------- */
function confetti(el) {
  if (window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const r = el.getBoundingClientRect(), cs = getComputedStyle(document.documentElement);
  const cols = ["--accent", "--mark", "--accent"].map(v => cs.getPropertyValue(v).trim());
  for (let i = 0; i < 9; i++) {
    const s = document.createElement("span"); s.className = "confetti";
    const a = Math.random() * Math.PI * 2, d = 18 + Math.random() * 26;
    s.style.left = (r.left + r.width / 2) + "px"; s.style.top = (r.top + r.height / 2) + "px";
    s.style.background = cols[i % cols.length];
    s.style.setProperty("--dx", Math.cos(a) * d + "px"); s.style.setProperty("--dy", Math.sin(a) * d - 20 + "px");
    s.style.setProperty("--rot", (Math.random() * 540 - 270) + "deg");
    if (i % 3 === 0) s.style.borderRadius = "50%";
    document.body.appendChild(s); setTimeout(() => s.remove(), 950);
  }
}

/* ---------- toast ---------- */
let toastT;
function toast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg; el.hidden = false;
  clearTimeout(toastT); toastT = setTimeout(() => { el.hidden = true; }, 3200);
}

/* ---------- small renderers ---------- */
const exTag = it => it.example ? ` <span class="ex">voorbeeld</span>` : "";
function chip(it, opts = {}) {
  const t = it.kind === "deadline" ? (it.start || "") : (it.start || "");
  return `<button class="chip ${it.kind} cat-${esc(it.cat)}${it.done ? " done" : ""}" data-act="open" data-id="${esc(it.id)}" title="${esc(KIND_LABEL[it.kind] + ": " + it.title)}">${t ? `<span class="t">${esc(t)}</span>` : ""}<span class="n">${esc(it.title)}</span></button>`;
}
function dlLeft(d) {
  if (d.done) return `<span class="left">afgerond</span>`;
  const n = daysBetween(todayKey(), d.date);
  if (n < 0) return `<span class="left late">${-n} ${-n === 1 ? "dag" : "dagen"} te laat</span>`;
  if (n === 0) return `<span class="left soon">vandaag</span>`;
  if (n === 1) return `<span class="left soon">morgen</span>`;
  return `<span class="left${n <= 3 ? " soon" : ""}">nog ${n} dagen</span>`;
}
function taskRow(t, opts = {}) {
  const dl = t.deadlineId && state.items[t.deadlineId];
  const meta = [];
  if (rangeLabel(t)) meta.push(`<span class="range">${esc(rangeLabel(t))} · ${daysBetween(t.date, t.endDate) + 1} dagen</span>`);
  else if (opts.showDate && t.date) meta.push(`<span>${esc(fmtShort(t.date))}</span>`);
  if (t.start) meta.push(`<span class="mono">${esc(timeRange(t))}</span>`);
  if (opts.showCat !== false && t.subject) meta.push(`<span class="tag cat-${esc(t.cat)}">${esc(t.subject)}</span>`);
  else if (opts.showCat !== false) meta.push(`<span class="tag cat-${esc(t.cat)}">${esc(CAT[t.cat]?.label || "")}</span>`);
  if (dl && !opts.hideDeadline) meta.push(`<span>⚑ ${esc(dl.title)} · ${esc(fmtShort(dl.date))}</span>`);
  if (t.done && t.doneAt && opts.showDoneAt) meta.push(`<span>gedaan ${esc(fmtShort(key(new Date(t.doneAt))))}</span>`);
  const actions = opts.schedule && !t.date ? `<div class="task-actions">
      <button class="btn small" data-act="schedule" data-id="${esc(t.id)}" data-when="0">Vandaag</button>
      <button class="btn small" data-act="schedule" data-id="${esc(t.id)}" data-when="1">Morgen</button></div>` : `<span></span>`;
  return `<div class="task${t.done ? " is-done" : ""}">
    <input type="checkbox" data-toggle="${esc(t.id)}" ${t.done ? "checked" : ""} aria-label="${esc("Afvinken: " + t.title)}" ${state.readOnly ? "disabled" : ""}>
    <div style="min-width:0"><button class="title" data-act="open" data-id="${esc(t.id)}">${esc(t.title)}</button>${exTag(t)}
      ${meta.length ? `<div class="meta">${meta.join("")}</div>` : ""}</div>
    ${actions}</div>`;
}
const sortTasks = list => list.slice().sort((a, b) => (a.done - b.done) || byTime(a, b));
function progress(list) {
  const done = list.filter(t => t.done).length, n = list.length;
  const pct = n ? Math.round(done / n * 100) : 0;
  return `<div class="progress"><span><b style="color:var(--ink)">${done}</b> van ${n} gedaan</span><span class="track"><i style="width:${pct}%"></i></span></div>`;
}
function quickAdd(date, label, withSubject) {
  return `<form class="quick" data-quick data-date="${esc(date || "")}">
    <input name="title" placeholder="${esc(label)}" aria-label="${esc(label)}" autocomplete="off" ${state.readOnly ? "disabled" : ""}>
    ${withSubject ? `<input name="subject" class="sm" placeholder="Vak (optioneel)" aria-label="Vak" list="dl-subjects" autocomplete="off">` : ""}
    <button class="btn" ${state.readOnly ? "disabled" : ""}>Toevoegen</button></form>`;
}

/* ---------- views ---------- */
function navbar(title, sub, withNav = true) {
  return `<div class="navbar">
    ${withNav ? `<div class="navbtns"><button class="btn" data-act="prev" aria-label="Vorige">‹</button><button class="btn" data-act="today">Vandaag</button><button class="btn" data-act="next" aria-label="Volgende">›</button></div>` : ""}
    <div style="min-width:0"><h1>${title}</h1>${sub ? `<div class="sub">${sub}</div>` : ""}</div></div>`;
}

function viewMonth() {
  const c = parse(state.cursor);
  const first = key(new Date(c.getFullYear(), c.getMonth(), 1));
  const start = weekStart(first);
  const today = todayKey();
  let html = navbar(`${MONTHS[c.getMonth()]} ${c.getFullYear()}`, "");
  html += `<div class="month"><div class="wk-h"></div>` + DOW.map((d, i) => `<div class="dow wd${i}">${d}</div>`).join("");
  for (let w = 0; w < 6; w++) {
    const ws = addDays(start, w * 7);
    if (w >= 4 && parse(ws).getMonth() !== c.getMonth()) break;
    html += `<div class="wk">${isoWeek(ws)}</div>`;
    for (let i = 0; i < 7; i++) {
      const k = addDays(ws, i), d = parse(k);
      // one pill per category: deadlines first, then planned activities
      const its = onDay(k, ["event", "deadline"]).sort((a, b) => (b.kind === "deadline") - (a.kind === "deadline") || byTime(a, b));
      const pills = its, shown = pills.slice(0, 4);
      html += `<div class="mcell${d.getMonth() !== c.getMonth() ? " out" : ""}${k === today ? " is-today" : ""}${i >= 5 ? " wkend" : ""}" data-act="goto" data-date="${k}" role="button" tabindex="0" aria-label="${esc(fmtLong(k) + (pills.length ? ": " + pills.map(p => (p.kind === "deadline" ? "deadline " : "") + p.title).join(", ") : ""))}">
        <span class="dnum">${d.getDate()}</span>
        ${shown.map(it => `<span class="mpill cat-${esc(it.cat)}${it.kind === "deadline" ? " dl" : ""}">${it.kind === "deadline" ? "⚑ " : ""}${esc(it.title)}</span>`).join("")}
        ${pills.length > 4 ? `<span class="more">+${pills.length - 4}</span>` : ""}</div>`;
    }
  }
  return html + `</div>`;
}

function viewWeek() {
  const ws = weekStart(state.cursor), we = addDays(ws, 6), today = todayKey();
  const a = parse(ws), b = parse(we);
  let html = navbar(`Week ${isoWeek(ws)}`, `${a.getDate()} ${MON_S[a.getMonth()]} – ${b.getDate()} ${MON_S[b.getMonth()]} ${b.getFullYear()}`);
  html += `<div style="display:flex;justify-content:flex-end;margin:-6px 0 10px"><label class="switch"><input type="checkbox" id="week-tasks" data-act-change="weektasks" ${state.weekTasks ? "checked" : ""}> Taken ook in de week tonen</label></div>`;
  html += `<div class="week">`;
  for (let i = 0; i < 7; i++) {
    const k = addDays(ws, i);
    const its = onDay(k, state.weekTasks ? ["event", "deadline", "task"] : ["event", "deadline"]);
    const tk = onDay(k, ["task"]);

      <button class="wday-h" data-act="goto" data-date="${k}"><span class="d">${DOW_LONG[i]}</span><span class="dnum${k === today ? " today" : ""}">${parse(k).getDate()} ${MON_S[parse(k).getMonth()]}</span></button>

      ${tk.length && !state.weekTasks ? `<button class="taskcount" data-act="goto" data-date="${k}"><b>${done}/${tk.length}</b> taken gedaan →</button>` : ""}</div></div>`;
  }
  return html + `</div>`;
}

function viewDay() {
  const k = state.cursor, today = todayKey(), ws = weekStart(k);
  let html = navbar(fmtLong(k).replace(/^./, c => c.toUpperCase()), k === today ? "Vandaag" : (daysBetween(today, k) === 1 ? "Morgen" : ""));
  html += `<div class="daystrip">` + Array.from({ length: 7 }, (_, i) => {
    const d = addDays(ws, i), tk = onDay(d, ["task"]), dn = tk.filter(t => t.done).length;
    return `<button data-act="goto" data-date="${d}" ${d === k ? 'aria-current="true"' : ""} class="wd${i}${d === today ? " today" : ""}">${DOW[i]}<b>${parse(d).getDate()}</b><span class="bar"><i style="width:${tk.length ? dn / tk.length * 100 : 0}%"></i></span></button>`;
  }).join("") + `</div>`;

  const timed = onDay(k, ["event", "deadline", "task"]).filter(i => i.start);
  const allday = onDay(k, ["event", "deadline"]).filter(i => !i.start);
  // layout timed blocks in lanes
  const blocks = timed.map(it => {
    let s = t2m(it.start), e = t2m(it.end);
    if (e == null || e <= s) e = s + (it.kind === "event" ? 60 : it.kind === "deadline" ? 30 : 45);
    s = Math.max(s, DAY_START * 60); e = Math.min(Math.max(e, s + 20), DAY_END * 60);
    return { it, s, e };
  }).sort((a, b) => a.s - b.s || b.e - a.e);
  let cluster = [], clusterEnd = -1;
  const flush = () => { const lanes = []; cluster.forEach(b => { let l = lanes.findIndex(end => end <= b.s); if (l < 0) { l = lanes.length; lanes.push(0); } lanes[l] = b.e; b.lane = l; }); cluster.forEach(b => b.lanes = lanes.length); cluster = []; };
  blocks.forEach(b => { if (b.s >= clusterEnd && cluster.length) flush(); cluster.push(b); clusterEnd = Math.max(clusterEnd, b.e); });
  flush();
  const H = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--hour")) || 52;
  let tl = "";
  for (let h = DAY_START; h < DAY_END; h++) tl += `<div class="hour"><span>${pad(h)}:00</span></div>`;
  blocks.forEach(b => {
    const top = (b.s - DAY_START * 60) / 60 * H, height = Math.max((b.e - b.s) / 60 * H - 2, 20);
    const w = 100 / b.lanes;
    tl += `<button class="block ${b.it.kind} cat-${esc(b.it.cat)}${b.it.done ? " done" : ""}" style="top:${top}px;height:${height}px;left:calc(${b.lane * w}% + 4px);width:calc(${w}% - 8px)" data-act="open" data-id="${esc(b.it.id)}"><span class="t">${esc(timeRange(b.it))}${b.it.kind === "deadline" ? " · deadline" : ""}</span><span class="n">${esc(b.it.title)}</span></button>`;
  });
  if (k === today) {
    const n = new Date(), m = n.getHours() * 60 + n.getMinutes();
    if (m >= DAY_START * 60) tl += `<div class="nowline" style="top:${(m - DAY_START * 60) / 60 * H}px"></div>`;
  }

  // tasks for the day, grouped by subject / category
  const tk = onDay(k, ["task"]);
  const groups = {};
  tk.forEach(t => { const g = t.subject ? "s:" + t.subject : "c:" + t.cat; (groups[g] = groups[g] || []).push(t); });
  const gkeys = Object.keys(groups).sort((a, b) => {
    const sa = a.startsWith("s:") ? 0 : 1, sb = b.startsWith("s:") ? 0 : 1; return sa - sb || a.localeCompare(b);
  });
  const dueSoon = deadlines().filter(d => !d.done && d.date >= k && daysBetween(k, d.date) <= 7).sort((a, b) => a.date.localeCompare(b.date) || byTime(a, b));

  html += `<div class="daygrid">
    <section class="panel plan-col"><div class="panel-h"><h2>Planning</h2><button class="btn small" data-act="new" data-date="${k}" data-kind="event" ${state.readOnly ? "disabled" : ""}>+ Activiteit</button></div>
      ${allday.length ? `<div class="allday"><span class="eyebrow">Hele dag</span>${allday.map(it => chip(it)).join("")}</div>` : ""}
      <div class="tl-hint">${matchMedia("(hover: none)").matches ? "Dubbeltik" : "Dubbelklik"} op een tijd om iets toe te voegen</div><div class="timeline">${tl}</div></section>
    <div style="display:grid;gap:16px;min-width:0">
      <section class="panel"><div class="panel-h"><h2>Te doen</h2><button class="btn small" data-act="new" data-date="${k}" data-kind="task" ${state.readOnly ? "disabled" : ""}>+ Taak met details</button></div>
        <div class="panel-b">${tk.length ? progress(tk) : ""}
        ${gkeys.map(g => {
          const list = sortTasks(groups[g]); const t0 = list[0];
          const label = g.startsWith("s:") ? g.slice(2) : (CAT[t0.cat]?.label || "Overig");
          return `<div class="group"><div class="group-h cat-${esc(t0.cat)}"><span class="tag">${esc(label)}</span><span class="muted mono" style="font-size:12px">${list.filter(t => t.done).length}/${list.length}</span></div>
            ${list.map(t => taskRow(t, { showCat: false })).join("")}</div>`;
        }).join("") || `<p class="empty">Nog geen taken voor deze dag. Splits je schoolwerk op in kleine stappen, bijvoorbeeld per vak.</p>`}
        ${quickAdd(k, "Nieuwe taak voor deze dag…", true)}</div></section>
      <section class="panel"><div class="panel-h"><h3>Deadlines komende week</h3></div><div class="panel-b">
        ${dueSoon.length ? `<div class="mini-dl">${dueSoon.map(d => `<button data-act="open" data-id="${esc(d.id)}" class="cat-${esc(d.cat)}"><span class="n"><span class="tag" style="margin-right:4px"></span>${esc(d.title)}</span><span class="muted" style="font-size:12.5px">${esc(fmtShort(d.date))}</span></button>`).join("")}</div>` : `<p class="empty">Geen deadlines in de komende 7 dagen.</p>`}
      </div></section>
    </div></div>`;
  return html;
}

function viewTodos() {
  const ws = weekStart(state.cursor), today = todayKey();
  const a = parse(ws), b = parse(addDays(ws, 6));
  const weekTasks = tasks().filter(t => t.date && t.date <= addDays(ws, 6) && (t.endDate || t.date) >= ws);
  let html = navbar(`To-do's week ${isoWeek(ws)}`, `${a.getDate()} ${MON_S[a.getMonth()]} – ${b.getDate()} ${MON_S[b.getMonth()]}`);
  html += `<section class="panel" style="margin-bottom:14px"><div class="panel-b" style="padding-top:14px">${progress(weekTasks)}</div></section>`;
  html += `<div style="display:grid;gap:12px">`;
  for (let i = 0; i < 7; i++) {
    const k = addDays(ws, i), list = sortTasks(onDay(k, ["task"]));
    html += `<section class="panel"><div class="panel-h"><h3 style="text-transform:capitalize">${DOW_LONG[i]} <span class="muted" style="font-weight:500">${parse(k).getDate()} ${MON_S[parse(k).getMonth()]}${k === today ? " · vandaag" : ""}</span></h3>
      <div style="display:flex;gap:6px;align-items:center"><span class="muted mono" style="font-size:12px">${list.filter(t => t.done).length}/${list.length}</span><button class="btn small ghost" data-act="goto" data-date="${k}">Dag openen →</button></div></div>
      <div class="panel-b">${list.map(t => taskRow(t)).join("") || `<p class="empty">Geen taken.</p>`}
      ${quickAdd(k, "Taak toevoegen…", true)}</div></section>`;

}

function viewDeadlines() {
  const all = deadlines();
  const open = all.filter(d => !d.done).sort((a, b) => a.date.localeCompare(b.date) || byTime(a, b));
  const closed = all.filter(d => d.done).sort((a, b) => b.date.localeCompare(a.date));

  html += `<div style="margin-bottom:12px"><button class="btn primary" data-act="new" data-kind="deadline" ${state.readOnly ? "disabled" : ""}>+ Deadline</button></div>`;

      <div style="min-width:0">

        ${d.notes ? `<p style="margin:6px 0 0;font-size:14px;overflow-wrap:anywhere">${esc(d.notes)}</p>` : ""}
        ${subs.length ? `<div class="subtasks">${progress(subs)}${subs.map(t => taskRow(t, { showDate: true, hideDeadline: true, showCat: false })).join("")}</div>` : ""}
      </div>

        <button class="btn small" data-act="toggle" data-id="${esc(d.id)}" ${state.readOnly ? "disabled" : ""}>${d.done ? "Heropenen" : "Afgerond ✓"}</button>
        <button class="btn small ghost" data-act="open" data-id="${esc(d.id)}">Bewerken</button>
      </div></article>`;
  };
  html += open.length ? `<div class="dl-list">${open.map(card).join("")}</div>` : `<p class="empty">Geen openstaande deadlines.</p>`;
  if (closed.length) {
    html += `<div style="margin-top:20px"><button class="btn ghost" data-act="toggle-closed">${state.showDoneDeadlines ? "▾" : "▸"} Afgeronde deadlines (${closed.length})</button></div>`;
    if (state.showDoneDeadlines) html += `<div class="dl-list" style="margin-top:8px">${closed.map(card).join("")}</div>`;

function viewDone() {
  const items = all().filter(i => (i.kind === "task" || i.kind === "deadline") && i.done && i.doneAt);
  const today = todayKey(), ws = weekStart(today);
  const dayOf = i => key(new Date(i.doneAt));
  const thisWeek = items.filter(i => dayOf(i) >= ws).length;
  const todayN = items.filter(i => dayOf(i) === today).length;
  let html = navbar("Gedaan", "Alles wat je hebt afgevinkt blijft hier bewaard.", false);
  html += `<div class="stats"><div class="stat"><b>${todayN}</b><span>vandaag</span></div><div class="stat"><b>${thisWeek}</b><span>deze week</span></div><div class="stat"><b>${items.length}</b><span>in totaal</span></div></div>`;
  const groups = {};
  items.forEach(i => (groups[dayOf(i)] = groups[dayOf(i)] || []).push(i));
  const days = Object.keys(groups).sort().reverse();
  html += `<section class="panel"><div class="panel-b" style="padding-top:4px">` + (days.map(d => `<div class="log-day"><div class="d">${d === today ? "Vandaag" : esc(DOW_LONG[dowIdx(d)])}<span>${parse(d).getDate()} ${MONTHS[parse(d).getMonth()]}</span></div>
    <div style="min-width:0">${groups[d].sort((a, b) => b.doneAt.localeCompare(a.doneAt)).map(i => i.kind === "deadline"
      ? `<div class="task is-done"><input type="checkbox" checked data-toggle="${esc(i.id)}" aria-label="${esc("Terugzetten: " + i.title)}" ${state.readOnly ? "disabled" : ""}><div style="min-width:0"><button class="title" data-act="open" data-id="${esc(i.id)}">⚑ ${esc(i.title)}</button><div class="meta"><span class="tag cat-${esc(i.cat)}">Deadline ${esc(fmtShort(i.date))}</span></div></div><span></span></div>`
      : taskRow(i, { showDate: true })).join("")}</div></div>`).join("") || `<p class="empty" style="padding-top:10px">Nog niets afgevinkt. Vink een taak af en hij verschijnt hier.</p>`) + `</div></section>`;
  return html;
}

function nextSlot(date, dur = 60, exceptId) {
  let m = 9 * 60;
  if (date === todayKey()) { const n = new Date(); m = Math.max(m, Math.ceil((n.getHours() * 60 + n.getMinutes() + 5) / 30) * 30); }
  const busy = onDay(date, ["event", "task"]).filter(i => i.start && i.id !== exceptId && !(i.kind === "task" && i.done))
    .map(i => { const s = t2m(i.start), e = t2m(i.end); return [s, e && e > s ? e : s + 60]; });
  for (let x = m; x + dur <= 23 * 60; x += 30) if (!busy.some(([s, e]) => x < e && x + dur > s)) { m = x; break; }
  m = Math.min(m, 23 * 60);
  return `${pad(Math.floor(m / 60))}:${pad(m % 60)}`;
}
function busyList(date, exceptId) {
  const its = onDay(date, ["event", "deadline", "task"]).filter(i => i.id !== exceptId && !(i.kind === "task" && i.done));
  const timed = its.filter(i => i.start), untimed = its.filter(i => !i.start && i.kind === "task").length;
  return `<span class="lbl">Al gepland op ${esc(fmtShort(date))}</span>` +
    (timed.map(i => `<span class="chip ${i.kind} cat-${esc(i.cat)}"><span class="t">${esc(timeRange(i))}</span><span class="n">${esc(i.title)}</span></span>`).join("") || `<span class="muted">Nog niets met een tijd.</span>`) +
    (untimed ? `<span class="muted">+ ${untimed} ${untimed === 1 ? "taak" : "taken"} zonder tijd</span>` : "");
}
function planForm(t) {
  const today = todayKey(), date = t.date || today;
  const dur = t.start && t.end ? t2m(t.end) - t2m(t.start) : 60;

  if (!durs.includes(dur) && dur > 0) durs.push(dur), durs.sort((a, b) => a - b);
  const fmtDur = m => m < 60 ? `${m} min` : `${m / 60} uur`.replace(".", ",");
  return `<form class="plan" data-plan data-id="${esc(t.id)}">
    <div class="row daypick"><span class="lbl">Dag</span>
      ${Array.from({ length: 7 }, (_, i) => { const d = addDays(today, i); return `<label class="wd${dowIdx(d)}"><input type="radio" name="pick" value="${d}" ${d === date ? "checked" : ""}>${i === 0 ? "vandaag" : i === 1 ? "morgen" : DOW[dowIdx(d)]}<b>${parse(d).getDate()}</b></label>`; }).join("")}
      <input type="date" name="date" value="${esc(date)}" aria-label="Andere datum"></div>
    <div class="row"><span class="lbl">Meerdere dagen? (optioneel)</span>
      <span class="muted" style="font-size:13px">tot en met</span><input type="date" name="endDate" value="${esc(t.endDate || "")}" aria-label="Tot en met"></div>
    <div class="row"><span class="lbl">Tijd</span>
      <input type="time" name="start" value="${esc(t.start || nextSlot(date, dur, t.id))}" aria-label="Begintijd">
      <select name="dur" aria-label="Duur">${durs.map(m => `<option value="${m}" ${m === dur ? "selected" : ""}>${fmtDur(m)}</option>`).join("")}</select>
      <label class="switch"><input type="checkbox" name="notime"> zonder tijd</label></div>
    <div class="busy" data-busy>${busyList(date, t.id)}</div>
    <div class="row"><button class="btn primary">Inplannen</button><button class="btn" type="button" data-act="plan-cancel">Annuleren</button>
      ${t.date ? `<button class="btn ghost" type="button" data-act="unplan" data-id="${esc(t.id)}">Terug naar lijst</button>` : ""}</div></form>`;
}
function viewList() {

    <button class="btn primary" ${state.readOnly ? "disabled" : ""}>Toevoegen</button>
    ${dls.length ? `<select name="deadlineId" aria-label="Hoort bij deadline" style="grid-column:1/-1"><option value="">Hoort niet bij een deadline</option>${dls.map(d => `<option value="${esc(d.id)}">⚑ ${esc(d.title)} · ${esc(fmtShort(d.date))}</option>`).join("")}</select>` : ""}
  </form>`;
  html += `<div class="filters"><div class="tabs">
      ${[["open", "Nog in te plannen"], ["planned", "Ingepland"], ["all", "Alles"]].map(([k, l]) => `<button data-act="list-filter" data-filter="${k}" aria-current="${f === k}">${l} <span class="mono" style="font-size:12px">${counts[k]}</span></button>`).join("")}
    </div></div>`;
  if (!list.length) return html + `<section class="panel"><div class="panel-b" style="padding-top:14px"><p class="empty">${f === "open" ? "Alles is ingepland. Voeg hierboven nieuwe taken toe." : f === "planned" ? "Nog niets ingepland. Kies bij een taak ‘Inplannen’." : "Nog geen taken. Voeg hierboven je eerste taak toe."}</p></div></section>`;
  const groups = {};
  list.forEach(t => { const g = t.subject ? "s:" + t.subject : "c:" + t.cat; (groups[g] = groups[g] || []).push(t); });
  const gkeys = Object.keys(groups).sort((a, b) => (a.startsWith("s:") ? 0 : 1) - (b.startsWith("s:") ? 0 : 1) || a.localeCompare(b));
  const sortL = l => l.slice().sort((a, b) => (a.done - b.done) || (a.date || "9").localeCompare(b.date || "9") || byTime(a, b) || (a.created || "").localeCompare(b.created || ""));
  html += `<div style="display:grid;gap:12px">` + gkeys.map(g => {
    const l = sortL(groups[g]), t0 = l[0], label = g.startsWith("s:") ? g.slice(2) : (CAT[t0.cat]?.label || "Overig");
    return `<section class="panel"><div class="panel-b" style="padding-top:8px"><div class="group-h cat-${esc(t0.cat)}"><span class="tag">${esc(label)}</span><span class="muted mono" style="font-size:12px">${l.length}</span></div>
      ${l.map(t => {
        const dl = t.deadlineId && state.items[t.deadlineId];
        const meta = [];
        if (t.date) meta.push(`<span class="planned-when">${esc(rangeLabel(t) || fmtShort(t.date))}${t.start ? " · " + esc(timeRange(t)) : ""}</span>`);
        if (t.subject) meta.push(`<span class="tag cat-${esc(t.cat)}">${esc(CAT[t.cat]?.label || "")}</span>`);

document.addEventListener("click", e => {
  const a = e.target.closest("[data-act]"); if (!a) {
    if (e.target.id === "overlay") closeModal();

  const act = a.dataset.act;
  if (act === "home") { closeModal(); state.cursor = todayKey(); setView("dag"); }
  else if (act === "view") setView(a.dataset.view);
  else if (act === "prev") slide(-1);
  else if (act === "next") slide(1);
  else if (act === "logout") { try { localStorage.removeItem(LS_LOGIN); sessionStorage.removeItem(LS_LOGIN); } catch (e) {} closeModal(); lock(); }
  else if (act === "pw-toggle") { const i = document.getElementById("l-pass"); i.type = i.type === "password" ? "text" : "password"; a.textContent = i.type === "password" ? "Toon" : "Verberg"; }

  else if (act === "new") {
    const it = blank(a.dataset.kind || (a.dataset.deadline ? "task" : (state.view === "dag" ? "task" : "event")), a.dataset.date);

  else if (act === "plan") { state.planning = state.planning === a.dataset.id ? null : a.dataset.id; render(); const pf = document.querySelector("form[data-plan] input[name=start]"); if (pf) pf.closest(".task").scrollIntoView({ block: "nearest" }); }
  else if (act === "plan-cancel") { state.planning = null; render(); }
  else if (act === "unplan") { const it = state.items[a.dataset.id]; if (it) { save({ ...it, date: "", endDate: "", start: "", end: "" }); state.planning = null; render(); toast("Terug op de lijst gezet"); } }
  else if (act === "list-filter") { state.listFilter = a.dataset.filter; state.planning = null; render(); }
  else if (act === "toggle-closed") { state.showDoneDeadlines = !state.showDoneDeadlines; render(); }
  else if (act === "schedule") {
    const it = state.items[a.dataset.id]; if (!it || state.readOnly) return;

    toast(`Ingepland voor ${a.dataset.when === "0" ? "vandaag" : "morgen"}`);
  }
  else if (act === "close") closeModal();
  else if (act === "cats") openCats();
  else if (act === "cat-inline") { const n = document.getElementById("newcat"); n.hidden = !n.hidden; if (!n.hidden) document.getElementById("f-newcat").focus(); }
  else if (act === "cat-inline-add") {
    const name = document.getElementById("f-newcat").value.trim(), color = document.getElementById("f-newcolor").value;

    setCats([...CATS, c]); saveCats();

    document.getElementById("newcat").hidden = true; document.getElementById("f-newcat").value = ""; document.getElementById("f-newcolor").value = SWATCHES[CATS.length % SWATCHES.length];
    toast(`Categorie ‘${c.label}’ toegevoegd`);

    if (a.dataset.armed !== "1") { a.dataset.armed = "1"; a.textContent = "Zeker? Klik nogmaals"; return; }
    const id = a.dataset.id, rest = CATS.filter(c => c.id !== id); if (!rest.length) return;

    setCats(rest); saveCats(); openCats(); render();
    toast(`Verwijderd. Items staan nu onder ‘${CAT[to].label}’.`);

    save(it); render();
    const nf = document.querySelector("form[data-biglist]");
    if (nf) { nf.elements.subject.value = keepSubject; if (nf.elements.deadlineId) nf.elements.deadlineId.value = keepDl; nf.elements.title.focus(); }
    return;
  }
  if (f.matches("form[data-plan]")) {
    const it = state.items[f.dataset.id]; if (!it) return;
    const date = f.elements.date.value; if (!date) { toast("Kies een dag."); return; }
    let start = "", end = "";
    if (!f.elements.notime.checked && f.elements.start.value) {
      start = f.elements.start.value;
      const e = Math.min(t2m(start) + Number(f.elements.dur.value), 23 * 60 + 59);
      end = `${pad(Math.floor(e / 60))}:${pad(e % 60)}`;
    }
    const endDate = f.elements.endDate.value > date ? f.elements.endDate.value : "";
    save({ ...it, date, endDate, start, end }); state.planning = null; render();
    toast(`Ingepland: ${fmtShort(date)}${start ? " " + start : ""}`);
    return;
  }
  if (f.matches("form[data-quick]")) {
    const title = f.elements.title.value.trim(); if (!title) return;
    const subject = f.elements.subject ? f.elements.subject.value.trim() : "";
    const it = blank("task", f.dataset.date);
    it.title = title; it.subject = subject; it.cat = defaultCat(subject || f.dataset.date ? "school" : "overig");
    save(it); render();
    const nf = [...document.querySelectorAll("form[data-quick]")].find(x => x.dataset.date === f.dataset.date);
    if (nf) { if (nf.elements.subject) nf.elements.subject.value = subject; nf.elements.title.focus(); }
    return;
  }
  if (f.id === "item-form" && editing) {
    const fd = new FormData(f);
    const kind = fd.get("kind");
    const it = { ...editing, kind, title: String(fd.get("title")).trim(), cat: fd.get("cat") || "overig", date: fd.get("date") || "",
      start: fd.get("start") || "", end: kind === "deadline" ? "" : (fd.get("end") || ""), subject: String(fd.get("subject") || "").trim(),
      endDate: kind !== "deadline" && fd.get("endDate") && fd.get("endDate") > (fd.get("date") || "") && fd.get("date") ? fd.get("endDate") : "",
      notes: String(fd.get("notes") || ""), deadlineId: kind === "task" ? (fd.get("deadlineId") || "") : "" };
    if (!it.title) return;
    if (kind === "event") { it.done = false; it.doneAt = null; }
    else if (f.elements.done) { const d = f.elements.done.checked; if (d !== !!editing.done) { it.done = d; it.doneAt = d ? new Date().toISOString() : null; } }
    save(it);
    const rep = Number(fd.get("repeat") || 0);
    if (rep > 0 && it.date) for (let i = 1; i <= rep; i++) save({ ...it, id: uid(), date: addDays(it.date, 7 * i), endDate: it.endDate ? addDays(it.endDate, 7 * i) : "" });
    closeModal(); render();
    toast(rep > 0 ? `Opgeslagen voor ${rep + 1} weken` : "Opgeslagen");
  }
});
window.addEventListener("hashchange", () => { const v = location.hash.slice(1); if (VIEWS.includes(v) && v !== state.view) { state.view = v; render(); } });
// keep the "now" line and relative labels fresh
setInterval(() => { if (state.view === "dag" && document.getElementById("overlay").hidden && !document.activeElement.closest("form")) render(); }, 60000);

/* ---------- double-click (or double-tap) on the day timeline adds an item at that time ---------- */
function addAtTime(tl, clientY) {
  if (state.readOnly) return;
  const hourEl = tl.querySelector(".hour"), H = hourEl ? hourEl.getBoundingClientRect().height : 52;
  const y = clientY - tl.getBoundingClientRect().top;
  let m = DAY_START * 60 + Math.floor((y / H) * 2) * 30;
  m = Math.max(DAY_START * 60, Math.min(m, 23 * 60));
  const e = Math.min(m + 60, 23 * 60 + 59);
  const it = blank("event", state.cursor);
  it.start = `${pad(Math.floor(m / 60))}:${pad(m % 60)}`; it.end = `${pad(Math.floor(e / 60))}:${pad(e % 60)}`;
  openModal(it);
}
document.addEventListener("dblclick", e => {
  const tl = e.target.closest(".timeline"); if (!tl || e.target.closest(".block")) return;
  e.preventDefault(); addAtTime(tl, e.clientY);
});
(() => {
  let last = 0, lx = 0, ly = 0;
  document.addEventListener("touchend", e => {
    const tl = e.target.closest && e.target.closest(".timeline"); if (!tl || e.target.closest(".block")) { last = 0; return; }
    const t = e.changedTouches[0], now = Date.now();
    if (now - last < 350 && Math.abs(t.clientX - lx) < 30 && Math.abs(t.clientY - ly) < 30) { last = 0; e.preventDefault(); addAtTime(tl, t.clientY); }
    else { last = now; lx = t.clientX; ly = t.clientY; }
  }, { passive: false });
})();

/* ---------- app-like swipe: content follows the finger ---------- */
const SWIPE_VIEWS = ["dag", "week", "maand", "todos"];
const reduceMotion = () => window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
let animating = false;
function slide(dir, fromX) {
  const m = document.getElementById("main"), w = m.offsetWidth || window.innerWidth;
  if (reduceMotion() || animating) { step(dir); m.style.transform = ""; return; }
  animating = true;
  m.style.transition = "transform .16s cubic-bezier(.4,0,1,1), opacity .16s";
  m.style.transform = `translateX(${-dir * w}px)`; m.style.opacity = ".2";
  setTimeout(() => {
    step(dir);
    m.style.transition = "none";
    m.style.transform = `translateX(${dir * w * 0.6}px)`; m.style.opacity = ".2";
    void m.offsetWidth;
    m.style.transition = "transform .28s cubic-bezier(.2,.8,.2,1), opacity .2s";
    m.style.transform = "translateX(0)"; m.style.opacity = "1";
    setTimeout(() => { m.style.transition = ""; m.style.transform = ""; m.style.opacity = ""; animating = false; }, 300);
  }, 160);
}
(() => {
  const m = document.getElementById("main");
  let sx = null, sy = 0, st = 0, dx = 0, lock = null;
  m.addEventListener("touchstart", e => {
    if (animating || e.touches.length !== 1 || !SWIPE_VIEWS.includes(state.view) || e.target.closest("input, textarea, select, .plan")) { sx = null; return; }
    sx = e.touches[0].clientX; sy = e.touches[0].clientY; st = Date.now(); dx = 0; lock = null;
  }, { passive: true });
  m.addEventListener("touchmove", e => {
    if (sx == null) return;
    const x = e.touches[0].clientX - sx, y = e.touches[0].clientY - sy;
    if (!lock && (Math.abs(x) > 8 || Math.abs(y) > 8)) lock = Math.abs(x) > Math.abs(y) * 1.2 ? "x" : "y";
    if (lock !== "x") return;
    e.preventDefault();
    dx = x;
    if (!reduceMotion()) { m.style.transition = "none"; m.style.transform = `translateX(${dx}px)`; m.style.opacity = String(1 - Math.min(Math.abs(dx) / (m.offsetWidth * 1.6), .5)); }
  }, { passive: false });
  const end = () => {
    if (sx == null) return; sx = null;
    if (lock !== "x") return;
    const w = m.offsetWidth || window.innerWidth, v = Math.abs(dx) / Math.max(Date.now() - st, 1);
    if (Math.abs(dx) > w * 0.22 || (v > 0.45 && Math.abs(dx) > 30)) slide(dx < 0 ? 1 : -1, dx);
    else { m.style.transition = "transform .22s cubic-bezier(.2,.8,.2,1), opacity .2s"; m.style.transform = "translateX(0)"; m.style.opacity = "1"; setTimeout(() => { if (!animating) { m.style.transition = ""; m.style.transform = ""; m.style.opacity = ""; } }, 240); }
  };
  m.addEventListener("touchend", end, { passive: true });
  m.addEventListener("touchcancel", end, { passive: true });
})();

/* ---------- login ---------- */
const LOGIN_HASH = "d6803b52ab9f3b8b6d5f5cbbb530d38f8cd71393c78dcb7a5020398e0304f110";
const LS_LOGIN = "agenda-login-v1";
async function sha256(t) {
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(t));
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, "0")).join("");
}
function lock() { document.body.classList.add("locked"); document.getElementById("login").hidden = false; setTimeout(() => document.getElementById("l-user").focus(), 50); }
function unlock() { document.body.classList.remove("locked"); document.getElementById("login").hidden = true; }
(() => {
  let ok = false; try { ok = localStorage.getItem(LS_LOGIN) === LOGIN_HASH || sessionStorage.getItem(LS_LOGIN) === LOGIN_HASH; } catch (e) {}
  if (ok) unlock(); else lock();
  document.getElementById("login-form").addEventListener("submit", async e => {
    e.preventDefault(); e.stopPropagation();
    const f = e.target, u = f.elements.username.value.trim().toLowerCase(), pw = f.elements.password.value;
    let h = ""; try { h = await sha256(u + ":" + pw); } catch (err) {}
    if (h === LOGIN_HASH) {
      try { (document.getElementById("l-remember").checked ? localStorage : sessionStorage).setItem(LS_LOGIN, h); } catch (err) {}
      f.reset(); document.getElementById("login-err").hidden = true; unlock(); toast("Hoi Maya, fijn dat je er bent!");
    } else {
      document.getElementById("login-err").hidden = false;
      f.classList.remove("shake"); void f.offsetWidth; f.classList.add("shake");
      f.elements.password.value = ""; f.elements.password.focus();
    }
  }, true);
})();

render();
initStore();
})();
